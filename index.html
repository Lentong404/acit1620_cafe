<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/styles.css">
    <!-- Favicon -->
     <link rel="icon" href="media/cat_favi.png" sizes="32x32"/>
    <title>Catata Café</title>
</head>
<body>
    <!-- Navigation -->
    <header>
        <nav>
            <a href="./index.html"><img class="home_icon" src="media/full_cat.svg" alt="A cat that is used as the Cafe icon"></a>
            <ul id="nav-toggle" class="nav-menu">
                <li><a href="./about.html">About</a></li>
                <li><a href="./menu.html">Menu</a></li>
                <li><a href="./contact.html">Contact</a></li>
            </ul>
        </nav>

        <button type="button" id="nav_button" class="hamenu">
            <div class="bar1"></div>
            <div class="bar2"></div>
            <div class="bar3"></div>
        </button>

        <h1 class="header_title">
            Catata Café
        </h1>
        <img class="hero" src="media/cafe_outside.jpg" alt="cafe outside">
    </header>
    <!-- Main -->
     <main>
        <!-- Daily Special -->
        <article class="daily_special">
            <h2>
                Daily Special
            </h2>
            <p>
                Our seasonal meow-nificent pumpkin latte.
            </p>
            <img class="daily_special_img" src="media/coffee_heart.jpg" alt="a croissant">
        </article>
        <!-- Featured Menu Items -->
        <article class="featured_menu" >
            <h2>Featured Menu</h2>
            

        </article>
        
        <!-- Store Cats -->
        <article class="store_mascots">
            <h2>Meet our store's adorable mascots!</h2>
            <section class="carousal">
                <div class="slider">
                    <div class="slides">
                        <div id="slide-1">
                            <img src="media/breakfast.jpg" alt="Assortment of breakfast foods.">
                        </div>

                        <div id="slide-2">
                            <img id="slide-1" src="media/croissant.jpg" alt="Assortment of breakfast foods.">
                        </div>

                        <div id="slide-3">
                            <img id="slide-1" src="media/iced_cofee.jpg" alt="Assortment of breakfast foods.">
                        </div>

                        <div id="slide-4">
                            <img id="slide-1" src="media/pastry_set.jpg" alt="Assortment of breakfast foods.">
                        </div>

                        <div id="slide-5">
                            <img id="slide-1" src="media/coffee_heart.jpg" alt="Assortment of breakfast foods.">
                        </div>
                    </div>
                    <a href="#slide-1">1</a>
                    <a href="#slide-2">2</a>
                    <a href="#slide-3">3</a>
                    <a href="#slide-4">4</a>
                    <a href="#slide-5">5</a>
                </div>
            </section>
            <a href="">
                <button type="button" class="cat_button">
                    Learn more about our fluffy friends!
                </button>
            </a>
        </article>

        <!-- Social Media -->
         <article class="social_media">
            <h2>
                Keep in touch via Social Media
            </h2>
         </article>
        
     </main>

    <!-- Footer -->
     <footer>

        <p>&copy Unemployed Inc</p>
     </footer>
     <!-- Javascript -->
    <script src="/scripts/script.js"></script>
    
</body>
</html>
