<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/styles.css">
    <!-- Favicon -->
     <link rel="icon" type="image/png" href="favicon.ico" sizes="32x32" />
     <!-- Javascript -->
    <script src="/scripts/script.js"></script>
    <title>Café Luna</title>
</head>

<body>
    <!-- Navigation -->
    <header>
        
        <nav>
            <ul id="nav-toggle" class="nav-menu">
                <li class="logo-placeholder"><a href="./index.html">Home</a></li>
                <li><a href="./about.html">About</a></li>
                <li><a href="./menu.html">Menu</a></li>
                <li><a href="./contact.html">Contact</a></li>
            </ul>
        </nav>

        <button class="hamenu" onclick="menu(this)">
            <div class="bar1"></div>
            <div class="bar2"></div>
            <div class="bar3"></div>
        </button>

        <script>
            function menu(x) {
            x.classList.toggle("change");

            var menu = document.getElementById("nav-toggle");
            if (menu.style.display === "flex") {
                menu.style.display = "none";
            } else {
                menu.style.display = "flex";
            }
            }
        </script>

        <section id="home" class="background">
            <h1 class="cafe-name">
                Luna Cafe.
            </h1>

            

            <a href="#footer"><img class="hero" src="media/cafe_outside.jpg" alt="cafe outside"></a>
        </section>
        
    </header>  


    <!-- Main -->
     <main>

        <section class="weekly_special">
            <p>
                <h3>
                    THa cool coffee :3
                </h3>
                
                <pre>
                 This cool coffeee is awesome
                        $10.95
                </pre>
            </p>
            <img class="imaje" src="media/iced_cofee.jpg" alt="iced coffee">
        </section>
        
     </main>

    <!-- Footer -->
     <footer id="footer">
        <a href="#home"><p>&copy Unemployed Inc</p></a></footer>
     </footer>
</body>
</html>
