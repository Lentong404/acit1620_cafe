<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/styles.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One&family=M+PLUS+Rounded+1c&display=swap" rel="stylesheet">
    <!-- Favicon -->
     <link rel="icon" href="media/cat_favi.png" sizes="32x32"/>
    <title>Café Luna</title>
</head>

<body>
    <!-- Navigation -->
    <header>
        <nav>
            <a href="./index.html"><img class="home_icon" src="media/full_cat.svg" alt="A cat that is used as the Cafe icon"></a>
            <ul id="nav-toggle" class="nav-menu">
                <li><a href="./about.html">About</a></li>
                <li><a href="./menu.html">Menu</a></li>
                <li><a href="./contact.html">Contact</a></li>
            </ul>
        </nav>

        <button type="button" id="nav_button" class="hamenu">
            <div class="bar1"></div>
            <div class="bar2"></div>
            <div class="bar3"></div>
        </button>

        <h1>
            Ready to book with us?
        </h1>
    </header>
    
    <!-- Main -->
     <main>
        <div class="contact_us_page">
            <!-- Contact Info -->
            <section class="contact_info">
                <h2>Contact Info:</h2>
                <article class="single_contact_info">
                    <h3>Call:</h3>
                    <p>+1 123-456-6789</p>
                </article>
                <article class="single_contact_info">
                    <h3>Write:</h3>
                    <p>anEmail@email.com</p>
                </article>
                <article class="single_contact_info">
                    <h3>Find Us:</h3>
                    <p>Some Address </p>
                </article>
            </section>
        
            <!-- Form Input  -->
            <section class="form_input_section">
                <h2>Send us a message!</h2>

                <form class="form_input" action="" method="post">

                    <article class="form_input_single" >
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="user_name" required />
                    </article>

                    <article class="form_input_single">
                        <label for="mail">Email:</label>
                        <input type="email" id="mail" name="user_email" required />
                    </article>

                    <article class="form_input_single">
                        <label for="msg">Message:</label>
                        <textarea id="msg" name="user_message" rows="8" required></textarea>
                    </article>

                    <p class="button">
                        <button class="cat_button3" type="submit">Send</button>
                    </p>
                    
                </form>
            </section>
        </div>
        

     </main>

    <!-- Footer -->
    <footer>
    <p>&copy Unemployed Inc</p>
    </footer>
    <!-- Javascript -->
    <script src="/scripts/script.js"></script>
</body>
</html>
